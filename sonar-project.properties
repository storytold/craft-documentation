sonar.projectKey=storytold_craft-wiki
sonar.organization=storytold

# Sources and tests both start at the root (see lightcraft); the worker's node:test file is a test.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.mjs

# Written by `npm run test:coverage`, which the SonarCloud workflow runs (node-coverage-script).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The Astro site (pages, components, content and its build scripts) has no unit tests; coverage
# measures the worker, which serves the API and auth.
sonar.coverage.exclusions=src/**,scripts/**,astro.config.mjs
